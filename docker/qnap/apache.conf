ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>
<Directory /var/www/html/system>
    Require all denied
</Directory>
<Directory /var/www/html/image>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
# Keep Apache's process count modest on the 2 GB TS-133.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
    MaxConnectionsPerChild 500
</IfModule>
